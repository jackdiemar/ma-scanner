[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/dashboard.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/scan_latest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
